name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 22.x, not the bare 22.12 floor: two transitive dev deps declare ^22.13.
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Catches what the other three cannot — malformed CSS among them.
      - run: npm run build
